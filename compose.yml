# Local full-stack setup for PostgreSQL and the Express API.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: haunted
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The schema runs when the database volume is created.
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d haunted']
      interval: 10s
      timeout: 5s
      retries: 5
    # The database stays inside the Compose network.

  api:
    build: ./server
    restart: unless-stopped
    environment:
      # Compose resolves db to the PostgreSQL container.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/haunted
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'   # localhost only; your tunnel reaches it here

volumes:
  pgdata:
